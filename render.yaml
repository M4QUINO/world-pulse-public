services:
  - type: web
    name: world-pulse-public
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: UPDATE_INTERVAL_HOURS
        value: 3
